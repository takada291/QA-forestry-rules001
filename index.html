<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伐採届出 QAアシスタント</title>
    
    <!-- Markdown描画用 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.4em;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .note {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-top: 5px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #result-area {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f8f5;
            border-left: 5px solid #1abc9c;
            border-radius: 4px;
            line-height: 1.6;
        }
        .model-badge {
            display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: bold;
            color: #fff; background-color: #27ae60; border-radius: 4px; margin-bottom: 12px;
        }
        .disclaimer {
            font-size: 0.85em;
            color: #e74c3c;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
        /* AIの回答内のマークダウン装飾 */
        #result-area h1, #result-area h2, #result-area h3 { color: #1b5e20; margin-top: 15px; margin-bottom: 5px; }
        #result-area p { margin-top: 0; margin-bottom: 10px; }
        #result-area ul { margin-top: 0; padding-left: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌲 伐採届出 QAアシスタント v2.0</h1>

    <div class="input-group">
        <label for="apiKey">Gemini APIキー</label>
        <input type="password" id="apiKey" placeholder="AI Studioで取得したAPIキーを入力">
        <div class="note">※一度入力するとブラウザに保存されます。</div>
    </div>

    <div class="input-group">
        <label for="question">ご質問内容</label>
        <textarea id="question" placeholder="例：間伐でも届出は必要ですか？"></textarea>
    </div>

    <button id="submitBtn" onclick="askAI()">AIに質問する</button>

    <div id="result-area"></div>

    <div class="disclaimer">
        ※本AIは林野庁の公開資料に基づいて回答しますが、最終的な判断・手続きについては必ず市町村の林務担当窓口へご確認ください。
    </div>
</div>

<script>
    // ページ読み込み時に、保存されたAPIキーを復元
    window.onload = function() {
        const savedKey = localStorage.getItem('gemini_api_key_forestry');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }
    };

    // ==========================================
    // AI通信処理 (フォールバック・タイムアウト実装)
    // ==========================================
    const MODEL_CANDIDATES = ["gemini-3.6-flash", "gemini-2.5-flash"];

    async function fetchWithTimeout(url, options, timeoutMs = 45000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try { return await fetch(url, { ...options, signal: controller.signal }); } 
        finally { clearTimeout(timer); }
    }

    async function callGeminiWithFallback(apiKey, basePayload, onStatusUpdate) {
        let lastErrorMsg = "";
        for (const modelName of MODEL_CANDIDATES) {
            if (onStatusUpdate) onStatusUpdate(modelName);
            const isGemini3 = modelName.startsWith("gemini-3");
            const payloadWithThinking = JSON.parse(JSON.stringify(basePayload));
            
            // v3系特有の設定
            if (isGemini3) {
                payloadWithThinking.generationConfig = {
                    ...(payloadWithThinking.generationConfig || {}),
                    thinkingConfig: { thinkingLevel: "LOW" }
                };
            }

            try {
                let response = await fetchWithTimeout(
                    `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadWithThinking) },
                    45000
                );
                let data = await response.json();

                // v3特有のエラー時のフォールバック処理
                if (data.error && response.status === 400 && isGemini3) {
                    response = await fetchWithTimeout(
                        `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(basePayload) },
                        45000
                    );
                    data = await response.json();
                }

                if (data.error) {
                    lastErrorMsg = `[${modelName}] ${data.error.message}`;
                    continue;
                }
                
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const parts = data.candidates[0].content.parts || [];
                    const answerPart = parts.find(p => typeof p.text === 'string' && !p.thought) || parts.find(p => typeof p.text === 'string');
                    if (answerPart) { return { text: answerPart.text, usedModel: modelName }; }
                }
            } catch (err) {
                lastErrorMsg = `[${modelName}] ${err.name === 'AbortError' ? 'タイムアウト(45秒超過)' : err.message}`;
            }
        }
        throw new Error(lastErrorMsg || "AIモデルでの通信に失敗しました。APIキーや利用制限をご確認ください。");
    }

    // ==========================================
    // メインの質問処理
    // ==========================================
    async function askAI() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const question = document.getElementById('question').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('result-area');

        // 入力チェック
        if (!apiKey) {
            alert("APIキーを入力してください。");
            return;
        }
        if (!question) {
            alert("質問内容を入力してください。");
            return;
        }

        // APIキー保存
        localStorage.setItem('gemini_api_key_forestry', apiKey);

        // UIの状態を変更
        submitBtn.disabled = true;
        resultArea.style.display = 'block';
        
        let sec = 0;
        let activeModel = "準備中";
        const updateTimerUI = () => {
            resultArea.innerHTML = `<div style="text-align:center; padding: 20px; font-weight:bold; color:#27ae60;">
                🤖 モデル [${activeModel}] でマニュアルを検索中...<br>
                <span style="font-size:12px; color:#666;">（経過時間: ${sec}秒）</span>
            </div>`;
        };
        updateTimerUI();
        const timerId = setInterval(() => { sec++; updateTimerUI(); }, 1000);

        try {
            // 1. GitHubからルールを読み込む
            const mdUrl1 = 'https://raw.githubusercontent.com/takada291/QA-forestry-rules001/refs/heads/main/rules001-001.md';
            const mdUrl2 = 'https://raw.githubusercontent.com/takada291/QA-forestry-rules001/refs/heads/main/rules001-002.md';

            const [mdResponse1, mdResponse2] = await Promise.all([
                fetch(mdUrl1),
                fetch(mdUrl2)
            ]);

            if (!mdResponse1.ok || !mdResponse2.ok) {
                throw new Error("ルールファイルの読み込みに失敗しました。ファイル名が間違っていないか確認してください。");
            }

            const ruleText1 = await mdResponse1.text();
            const ruleText2 = await mdResponse2.text();

            // 2. システム指示を構築
            const systemInstruction = `
あなたは林野庁の伐採届出に関する優秀な行政アシスタントです。
以下の【基本マニュアル】と【詳細Q&A・例外ルール】の内容のみを情報源として、ユーザーの質問に正確に答えてください。

【厳守するルール】
- 提供された資料に記載されている事実のみを回答すること。
- 資料に記載がない場合、絶対に推測や一般論で回答せず、「提供されたマニュアルには記載がないため、市町村の担当窓口にご確認ください」と回答すること。
- 保安林や林地開発など、伐採届以外の制度が絡む例外ケースについては特に注意深く資料を確認すること。
- 回答は分かりやすく、丁寧なトーンで行うこと。

【基本マニュアル】
${ruleText1}

【詳細Q&A・例外ルール】
${ruleText2}
`;

            // 3. APIリクエスト用ペイロード
            const requestBody = {
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: [{ parts: [{ text: question }] }]
            };

            // 4. API通信実行（フォールバック付き）
            const result = await callGeminiWithFallback(apiKey, requestBody, (m) => {
                activeModel = m;
                updateTimerUI();
            });

            // 5. 成功時の画面描画 (marked.jsでマークダウンをHTMLに変換)
            resultArea.innerHTML = `
                <span class="model-badge">使用モデル: ${result.usedModel}</span>
                <div>${marked.parse(result.text)}</div>
            `;

        } catch (error) {
            console.error(error);
            resultArea.innerHTML = `<div style="color: #e74c3c; font-weight: bold;">エラーが発生しました: ${error.message}</div>`;
        } finally {
            clearInterval(timerId);
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
